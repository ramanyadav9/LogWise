[project]
name = "logwise"
version = "0.2.0a1"
description = "AI-powered log intelligence TUI for files, Docker, and stdin"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Raman Yadav", email = "9ramanyadav@gmail.com" },
]
keywords = ["logs", "tui", "textual", "tail", "ai", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: Terminals",
]
dependencies = [
    "typer>=0.12",
    "textual>=0.83",
    "rich>=13.7",
    "aiofiles>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
logwise = "logwise.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logwise"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
